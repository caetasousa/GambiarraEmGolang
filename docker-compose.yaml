services:
  annygo-postgres:
    image: postgres:16-alpine
    container_name: annygo-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: annygo
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d annygo"]
      interval: 5s
      timeout: 5s
      retries: 10

  annygo-pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    depends_on:
      annygo-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 8081:80
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin

  flyway:
    image: flyway/flyway:latest
    container_name: annygo-flyway
    depends_on:
      annygo-postgres:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/flyway/sql:/flyway/sql
      - ./backend/flyway/conf:/flyway/conf
    networks:
      - default

networks:
  default:
    name: local-network
    external: true

# =============================================================================
# PRE-REQUISITOS (executar uma única vez antes do primeiro docker compose up)
# =============================================================================

# 1. Criar a rede Docker compartilhada:
#    docker network create local-network

# 2. Criar as pastas de dados:
#    mkdir -p ~/annygo/data/pgadmin
#    mkdir -p ~/annygo/data/postgres

# 3. Dar permissão de escrita para o pgAdmin (UID 5050):
#    sudo chmod -R 777 ~/annygo/data/pgadmin

# =============================================================================
# SUBIR OS SERVIÇOS
# =============================================================================

# Subir tudo (postgres + pgadmin + flyway migrations):
#   docker compose up

# Subir em background:
#   docker compose up -d

# Remover containers órfãos (ex: annygo-zitadel):
#   docker compose up --remove-orphans

# =============================================================================
# PGADMIN
# =============================================================================

# Acesse: http://localhost:8081
# Email:  admin@localhost.com
# Senha:  admin

# Para registrar o servidor do banco:
#   1. Botão direito em "Servers" > Register > Server...
#   2. Aba General  → Nome: annygo
#   3. Aba Connection:
#      Host:     annygo-postgres
#      Port:     5432
#      Database: annygo
#      Username: postgres
#      Password: postgres

# =============================================================================
# BACKEND (Go + Swagger)
# =============================================================================

# cd ~/annygo/backend
# go run cmd/api/main.go
# Swagger UI: http://localhost:8080/swagger/index.html

# =============================================================================
# FRONTEND (SvelteKit)
# =============================================================================

# cd ~/annygo/frontend
# npm run dev
# Frontend: http://localhost:5173
